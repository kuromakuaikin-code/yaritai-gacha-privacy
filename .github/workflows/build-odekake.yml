name: 東海おでかけナビ自動ビルド

# spots.json か build.py が変更されたら、個別ページと sitemap を自動再生成してコミットする。
# これにより管理者は GitHub の Web 画面（スマホ可）で spots.json を編集するだけでよい。
on:
  push:
    paths:
      - "odekake/spots.json"
      - "odekake/build.py"
      - "odekake/site-config.json"

permissions:
  contents: write

concurrency:
  group: build-odekake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: 個別ページ・sitemap を生成
        run: python3 odekake/build.py

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- odekake/s
          if [ -e odekake/sitemap.xml ]; then
            git add -A -- odekake/sitemap.xml
          fi
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動ビルド: スポットページと sitemap を再生成"
            # 盆踊りナビのビルドと同時に走ると push が競合し、黙って再生成されないまま
            # 終わってしまう。生成先ディレクトリは別なので rebase すれば衝突しない。
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push が競合したので rebase して再試行 ($i/3)"
              git pull --rebase origin "${{ github.ref_name }}"
            done
            git push
          fi
