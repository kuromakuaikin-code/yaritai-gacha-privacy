<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!--
      読み込めるものをアプリ内のファイルだけに限定する。
      外部への通信は一切しない (LM Studio / VOICEVOX との通信は main.js が代行する)。
      script-src に 'unsafe-inline' があるのは、下の importmap がインラインの
      <script> だから。LLM の返事は必ず textContent で入れるので HTML にはならない。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'"
    />
    <title>ai-companion</title>
    <link rel="stylesheet" href="./style.css" />

    <!--
      importmap: 素の ES modules で node_modules の中を直接読むための対応表。
      ビルドツール (vite 等) を入れずに import 文を使うためのしくみです。
      パスの起点は companion://local/ = ai-companion/app/ フォルダ。
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/examples/jsm/": "/node_modules/three/examples/jsm/",
          "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
        }
      }
    </script>
  </head>

  <body>
    <!-- キャラの描画面。マウス操作は受け取らず、当たり判定はレイキャストで行う -->
    <canvas id="canvas"></canvas>

    <!-- 吹き出し (返事の表示)。読むだけなのでマウス操作は受けない -->
    <div id="bubble" class="hidden" role="status" aria-live="polite"></div>

    <!-- キャラを右クリックすると出るメニュー。ふだんは存在ごと消えている -->
    <div id="menu" class="ui hidden" role="menu">
      <button id="menu-talk" type="button">入力欄を出す</button>
      <button id="menu-model" type="button">別の VRM に変える</button>
      <button id="menu-minimize" type="button">しまう</button>
      <button id="menu-quit" type="button">終了する</button>
    </div>

    <!-- 会話の入力欄 -->
    <form id="bar" class="ui hidden" autocomplete="off">
      <input
        id="input"
        type="text"
        placeholder="話しかける…"
        maxlength="500"
        aria-label="メッセージ"
      />
      <button id="send" type="submit">送る</button>
    </form>

    <!-- 初回セットアップ / モデル変更のパネル -->
    <div id="setup" class="ui hidden">
      <h1>キャラクターを選んでください</h1>
      <p>
        このアプリに VRM モデルは同梱していません。<br />
        あなたの推しの <b>.vrm</b> ファイルを入れてください。
      </p>
      <p class="drop-hint">ここにファイルをドラッグ＆ドロップ</p>
      <div class="setup-buttons">
        <button id="setup-pick" type="button">VRM ファイルを選ぶ</button>
        <button id="setup-close" type="button" class="ghost hidden">やめる</button>
      </div>
      <p id="setup-message" class="note">
        選んだ場所は記憶され、次回の起動から自動で読み込まれます。
      </p>
    </div>

    <script type="module" src="./main.mjs"></script>
  </body>
</html>
