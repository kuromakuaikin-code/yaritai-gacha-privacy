<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>こえかえ｜端末内だけで声を変えるボイスチェンジャー</title>
<meta name="description" content="録った声をその場で変えるボイスチェンジャー。ネタ声からガチの自然な声質変更まで。音声は端末の外に一切送信しません。">
<meta name="theme-color" content="#6d5bd0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d5bd0'/%3E%3Crect x='26' y='13' width='12' height='24' rx='6' fill='%23fff'/%3E%3Cpath d='M20 32a12 12 0 0 0 24 0' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M32 44v7' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5fb; --card:#fff; --fg:#1c1b22; --sub:#6b6878;
  --line:#e4e1ee; --accent:#6d5bd0; --accent-soft:#efecfb;
  --danger:#d2455f; --ok:#2e9e6b;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15141a; --card:#1e1d26; --fg:#f0eef7; --sub:#9d99ad;
    --line:#302e3c; --accent:#9d8cf5; --accent-soft:#272338;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px}
header{text-align:center;padding:18px 0 10px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:.04em}
.tag{font-size:12.5px;color:var(--sub);margin:0}
.privacy-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin:14px 0;
}
.card h2{font-size:14px;margin:0 0 12px;color:var(--sub);font-weight:700;letter-spacing:.06em}

/* 録音 */
.rec-area{text-align:center}
#recBtn{
  width:132px;height:132px;border-radius:50%;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-size:15px;font-weight:700;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 6px 20px rgba(109,91,208,.32);transition:transform .12s, background .2s;
  -webkit-tap-highlight-color:transparent;
}
#recBtn:active{transform:scale(.96)}
#recBtn.recording{background:var(--danger);box-shadow:0 6px 24px rgba(210,69,95,.4);animation:pulse 1.4s infinite}
#recBtn:disabled{opacity:.5;cursor:default;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 6px 24px rgba(210,69,95,.4)}50%{box-shadow:0 6px 34px rgba(210,69,95,.7)}}
.mic-icon{font-size:30px;line-height:1}
#meter{width:100%;max-width:280px;height:44px;display:block;margin:12px auto 0}
#recStatus{font-size:13px;color:var(--sub);margin:8px 0 0;min-height:20px}

/* プリセット */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{
  flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--sub);font-size:13.5px;font-weight:700;cursor:pointer;
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-hint{font-size:12px;color:var(--sub);margin:0 0 12px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.preset{
  border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:12px;padding:11px 4px;cursor:pointer;font-size:12.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  -webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s;
}
.preset .emo{font-size:22px;line-height:1.1}
.preset.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* スライダー */
.slider-row{margin:14px 0}
.slider-row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.slider-row .val{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
details.adv{margin-top:6px}
details.adv summary{font-size:13px;color:var(--sub);cursor:pointer;padding:6px 0;font-weight:600}

/* 再生 */
.play-row{display:flex;gap:8px;margin-top:4px}
.btn{
  flex:1;padding:13px 8px;border-radius:12px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.42;cursor:default}
.btn.wide{width:100%;margin-top:8px}
#playStatus{font-size:12.5px;color:var(--sub);margin:10px 0 0;text-align:center;min-height:19px}

/* モニター */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch-row .txt{font-size:13.5px}
.switch-row .txt small{display:block;color:var(--sub);font-size:11.5px;line-height:1.5}
.sw{position:relative;width:50px;height:29px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{
  position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer;
}
.sw span:before{
  content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s;
}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span:before{transform:translateX(21px)}

.note{font-size:12px;color:var(--sub);margin:10px 0 0;padding:10px;background:var(--bg);border-radius:9px}
.err{background:#fdecef;color:#a32b44;border-radius:10px;padding:12px;font-size:13px;margin:12px 0}
@media (prefers-color-scheme: dark){.err{background:#3a1c24;color:#f5a8b8}}
footer{text-align:center;font-size:12px;color:var(--sub);margin-top:26px}
footer a{color:var(--sub)}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>こえかえ</h1>
  <p class="tag">録った声を、その場で変える</p>
  <div class="privacy-badge">🔒 音声は端末の外に出ません</div>
</header>

<div id="errBox" class="err hidden"></div>

<!-- 録音 -->
<div class="card rec-area">
  <button id="recBtn"><span class="mic-icon">🎤</span><span id="recLabel">タップで録音</span></button>
  <canvas id="meter" width="560" height="88"></canvas>
  <p id="recStatus">最大30秒。まず適当に一言しゃべってみてください。</p>
</div>

<!-- プリセット -->
<div class="card">
  <h2>プリセット</h2>
  <div class="tabs">
    <button class="tab active" data-tab="gachi">ガチ（自然に）</button>
    <button class="tab" data-tab="neta">ネタ（おもしろ）</button>
  </div>
  <p class="tab-hint" id="tabHint">別人に聞こえるが、人の声として自然な範囲。</p>
  <div class="grid" id="presetGrid"></div>

  <details class="adv">
    <summary>手動で微調整する</summary>
    <div class="slider-row">
      <label>声の高さ <span class="val" id="vSemi">0</span></label>
      <input type="range" id="sSemi" min="-12" max="12" step="0.5" value="0">
    </div>
    <div class="slider-row">
      <label>声の太さ <span class="val" id="vThick">0</span></label>
      <input type="range" id="sThick" min="-1" max="1" step="0.05" value="0">
    </div>
    <div class="slider-row">
      <label>ざらつき <span class="val" id="vDrive">0</span></label>
      <input type="range" id="sDrive" min="0" max="1" step="0.05" value="0">
    </div>
    <div class="slider-row">
      <label>反響 <span class="val" id="vEcho">0</span></label>
      <input type="range" id="sEcho" min="0" max="0.8" step="0.05" value="0">
    </div>
  </details>
</div>

<!-- 再生 -->
<div class="card">
  <h2>聴く・保存する</h2>
  <div class="play-row">
    <button class="btn" id="playBtn" disabled>▶ 変換後</button>
    <button class="btn ghost" id="playRawBtn" disabled>▶ 元の声</button>
  </div>
  <button class="btn ghost wide" id="saveBtn" disabled>⬇ 音声ファイルで保存・共有</button>
  <p id="playStatus"></p>
</div>

<!-- リアルタイム -->
<div class="card">
  <h2>リアルタイム</h2>
  <div class="switch-row">
    <div class="txt">
      変換した自分の声を聞きながら話す
      <small>必ずイヤホンを使ってください。スピーカーだとハウリングします。</small>
    </div>
    <label class="sw"><input type="checkbox" id="monSw"><span></span></label>
  </div>
  <p class="note" id="monNote">高さの変更だけが反映されます（反響・ざらつきは録音時のみ）。</p>
</div>

<footer>
  <p><a href="./privacy.html">プライバシーポリシー</a></p>
  <p>音声処理はすべてブラウザ内で完結します。録音データがサーバーへ送られることはありません。</p>
</footer>

</div>

<script>
"use strict";

/* ============================================================
   設定
   ============================================================ */
const MAX_SEC = 30;
// グラニュラー粒径。実測で調波の再現度を比較して決めた値。
//   4096: +12半音で 88.8% 再現（2048 は 69.5%）。遅延85msは録音後処理なら無関係。
//   2048: 遅延43ms。監聴は遅れが不快になるので品質より遅延を優先する。
const GRAIN_OFFLINE = 4096;
const GRAIN_LIVE = 2048;

const PRESETS = {
  gachi: [
    { id:"flat",  name:"素のまま", emo:"⚪", s:{} },
    { id:"fem",   name:"女性寄り", emo:"🙋‍♀️", s:{ semi:+5,   thick:-0.45 } },
    { id:"male",  name:"男性寄り", emo:"🙋‍♂️", s:{ semi:-5,   thick:+0.45 } },
    { id:"up",    name:"少し高く", emo:"↗️", s:{ semi:+2,   thick:-0.15 } },
    { id:"down",  name:"少し低く", emo:"↘️", s:{ semi:-2,   thick:+0.15 } },
    { id:"alt1",  name:"別人A",    emo:"🎭", s:{ semi:+3.5, thick:-0.3 } },
    { id:"alt2",  name:"別人B",    emo:"🎭", s:{ semi:-3.5, thick:+0.3 } },
    { id:"soft",  name:"やわらか", emo:"🍮", s:{ semi:+1.5, thick:-0.25, echo:0.12, echoMs:90, echoFb:0.15 } }
  ],
  neta: [
    { id:"helium", name:"ヘリウム", emo:"🎈", s:{ semi:+10, thick:-0.5 } },
    { id:"squirrel",name:"リス",   emo:"🐿️", s:{ semi:+12, thick:-0.6 } },
    { id:"demon",  name:"魔王",     emo:"😈", s:{ semi:-10, thick:+0.5, drive:0.35 } },
    { id:"zombie", name:"ゾンビ",   emo:"🧟", s:{ semi:-7,  thick:+0.3, drive:0.5 } },
    { id:"robot",  name:"ロボット", emo:"🤖", s:{ ring:0.85, ringHz:42 } },
    { id:"alien",  name:"宇宙人",   emo:"👽", s:{ semi:+4, ring:0.7, ringHz:190 } },
    { id:"phone",  name:"電話ごし", emo:"☎️", s:{ phone:true, drive:0.1 } },
    { id:"mega",   name:"拡声器",   emo:"📣", s:{ phone:true, drive:0.55 } },
    { id:"cave",   name:"洞窟",     emo:"🕳️", s:{ echo:0.5, echoMs:170, echoFb:0.5 } },
    { id:"ghost",  name:"幽霊",     emo:"👻", s:{ semi:-3, echo:0.55, echoMs:260, echoFb:0.55, ring:0.25, ringHz:12 } }
  ]
};

const DEFAULTS = { semi:0, thick:0, ring:0, ringHz:45, phone:false, drive:0, echo:0, echoMs:180, echoFb:0.4 };
let settings = Object.assign({}, DEFAULTS);

/* ============================================================
   状態
   ============================================================ */
let audioCtx = null;
let micStream = null;
let rawPCM = null;          // Float32Array（未加工の録音）
let rawRate = 48000;
let renderedBuf = null;     // AudioBuffer（変換後）
let renderDirty = true;
let isRecording = false;
let currentSource = null;
let monitorNodes = null;
let workletReady = false;
let activeTab = "gachi";
let activePreset = null;

const $ = id => document.getElementById(id);

/* ============================================================
   ワークレット（リアルタイム監聴用のピッチシフト）
   ============================================================ */
const WORKLET_SRC = `
class PitchShifter extends AudioWorkletProcessor {
  static get parameterDescriptors(){
    return [{name:'ratio', defaultValue:1, minValue:0.25, maxValue:4, automationRate:'k-rate'}];
  }
  constructor(){
    super();
    this.N = 8192;
    this.buf = new Float32Array(this.N);
    this.w = 0;
    this.grain = ${GRAIN_LIVE};
    this.p = 0;
  }
  read(d){
    let x = this.w - 1 - d;
    while(x < 0) x += this.N;
    const i = Math.floor(x) % this.N;
    const f = x - Math.floor(x);
    const a = this.buf[i];
    const b = this.buf[(i + 1) % this.N];
    return a + (b - a) * f;
  }
  process(inputs, outputs, params){
    const ch = inputs[0][0];
    const out = outputs[0][0];
    if(!out) return true;
    const R = params.ratio[0];
    const g = this.grain;
    const step = (1 - R) / g;
    const TAU = Math.PI * 2;
    for(let n = 0; n < out.length; n++){
      this.buf[this.w] = ch ? ch[n] : 0;
      this.w = (this.w + 1) % this.N;
      let p1 = this.p;
      let p2 = p1 + 0.5; if(p2 >= 1) p2 -= 1;
      const w1 = 0.5 - 0.5 * Math.cos(TAU * p1);
      const w2 = 0.5 - 0.5 * Math.cos(TAU * p2);
      out[n] = w1 * this.read(p1 * g) + w2 * this.read(p2 * g);
      this.p += step;
      if(this.p >= 1) this.p -= 1;
      else if(this.p < 0) this.p += 1;
    }
    return true;
  }
}
registerProcessor('pitch-shifter', PitchShifter);

class Capture extends AudioWorkletProcessor {
  constructor(){ super(); this.acc = []; this.n = 0; }
  process(inputs){
    const ch = inputs[0][0];
    if(ch){
      this.acc.push(new Float32Array(ch));
      this.n += ch.length;
      if(this.n >= 4096){
        const out = new Float32Array(this.n);
        let o = 0;
        for(const a of this.acc){ out.set(a, o); o += a.length; }
        this.port.postMessage(out, [out.buffer]);
        this.acc = []; this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor('capture', Capture);
`;

/* ============================================================
   オフライン処理：グラニュラー・ピッチシフト（純JS）
   OfflineAudioContext + AudioWorklet の組み合わせは環境差が大きいので、
   ピッチは素のJSで処理し、フィルタ類だけネイティブノードに任せる。
   ============================================================ */
function pitchShift(input, ratio, g){
  if(Math.abs(ratio - 1) < 1e-4) return input;
  const N = input.length;
  const out = new Float32Array(N);
  g = g || GRAIN_OFFLINE;
  const step = (1 - ratio) / g;
  const TAU = Math.PI * 2;
  let p = 0;
  for(let n = 0; n < N; n++){
    let p1 = p;
    let p2 = p1 + 0.5; if(p2 >= 1) p2 -= 1;
    const w1 = 0.5 - 0.5 * Math.cos(TAU * p1);
    const w2 = 0.5 - 0.5 * Math.cos(TAU * p2);
    out[n] = w1 * tap(input, n, p1 * g) + w2 * tap(input, n, p2 * g);
    p += step;
    if(p >= 1) p -= 1;
    else if(p < 0) p += 1;
  }
  return out;
}
function tap(src, n, d){
  const x = n - d;
  if(x < 0) return 0;
  const i = Math.floor(x);
  const f = x - i;
  const a = src[i] || 0;
  const b = src[i + 1] || 0;
  return a + (b - a) * f;
}

function makeCurve(amount){
  const k = 1 + amount * 70;
  const n = 2048;
  const c = new Float32Array(n);
  const norm = Math.tanh(k);
  for(let i = 0; i < n; i++){
    const x = (i * 2) / n - 1;
    c[i] = Math.tanh(k * x) / norm;
  }
  return c;
}

function buildEffects(ctx, src, s){
  let node = src;

  // 声の太さ：低域シェルフと中高域ピークを逆方向に振るチルト
  if(Math.abs(s.thick) > 0.001){
    const ls = ctx.createBiquadFilter();
    ls.type = "lowshelf"; ls.frequency.value = 320; ls.gain.value = s.thick * 8;
    const pk = ctx.createBiquadFilter();
    pk.type = "peaking"; pk.frequency.value = 1900; pk.Q.value = 0.9; pk.gain.value = -s.thick * 7;
    node.connect(ls); ls.connect(pk); node = pk;
  }

  // リングモジュレーション（ロボット・宇宙人）
  if(s.ring > 0.001){
    const mod = ctx.createGain(); mod.gain.value = 0;
    const osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = s.ringHz;
    osc.connect(mod.gain); osc.start();
    const wet = ctx.createGain(); wet.gain.value = s.ring;
    const dry = ctx.createGain(); dry.gain.value = 1 - s.ring;
    const mix = ctx.createGain();
    node.connect(mod); mod.connect(wet); wet.connect(mix);
    node.connect(dry); dry.connect(mix);
    node = mix;
  }

  // ざらつき
  if(s.drive > 0.001){
    const ws = ctx.createWaveShaper();
    ws.curve = makeCurve(s.drive);
    ws.oversample = "4x";
    const trim = ctx.createGain(); trim.gain.value = 1 / (1 + s.drive);
    node.connect(ws); ws.connect(trim); node = trim;
  }

  // 電話・拡声器
  if(s.phone){
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 380; hp.Q.value = 0.7;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass";  lp.frequency.value = 3200; lp.Q.value = 0.7;
    const pk = ctx.createBiquadFilter(); pk.type = "peaking";  pk.frequency.value = 1600; pk.Q.value = 1.2; pk.gain.value = 6;
    node.connect(hp); hp.connect(lp); lp.connect(pk); node = pk;
  }

  // 反響
  if(s.echo > 0.001){
    const dly = ctx.createDelay(1.5); dly.delayTime.value = s.echoMs / 1000;
    const fb  = ctx.createGain(); fb.gain.value = Math.min(s.echoFb, 0.75);
    const wet = ctx.createGain(); wet.gain.value = s.echo;
    const mix = ctx.createGain();
    node.connect(mix);
    node.connect(dly);
    dly.connect(fb); fb.connect(dly);
    dly.connect(wet); wet.connect(mix);
    node = mix;
  }

  return node;
}

async function render(){
  if(!rawPCM) return null;
  const s = settings;
  const ratio = Math.pow(2, s.semi / 12);
  const shifted = pitchShift(rawPCM, ratio);

  const tail = s.echo > 0.001 ? Math.ceil(rawRate * 1.4) : 0;
  const len = shifted.length + tail;
  const off = new OfflineAudioContext(1, len, rawRate);

  const buf = off.createBuffer(1, shifted.length, rawRate);
  buf.copyToChannel(shifted, 0);
  const src = off.createBufferSource();
  src.buffer = buf;

  const last = buildEffects(off, src, s);
  last.connect(off.destination);
  src.start();

  const out = await off.startRendering();

  // ピーク正規化（小さすぎ／割れを防ぐ）
  const d = out.getChannelData(0);
  let peak = 0;
  for(let i = 0; i < d.length; i++){ const v = Math.abs(d[i]); if(v > peak) peak = v; }
  if(peak > 0.0001){
    const gain = Math.min(0.95 / peak, 8);
    for(let i = 0; i < d.length; i++) d[i] *= gain;
  }
  return out;
}

/* ============================================================
   録音
   ============================================================ */
async function ensureCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) throw new Error("このブラウザは Web Audio に対応していません。");
    audioCtx = new AC();
    try{
      const blob = new Blob([WORKLET_SRC], { type: "application/javascript" });
      const url = URL.createObjectURL(blob);
      await audioCtx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      workletReady = true;
    }catch(e){
      workletReady = false;
    }
  }
  if(audioCtx.state === "suspended") await audioCtx.resume();
  return audioCtx;
}

async function getMic(){
  if(micStream && micStream.active) return micStream;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error("このブラウザではマイクを使えません。Safari か Chrome の最新版でお試しください。");
  }
  const raw = { echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1 };
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio: raw });
  }catch(e){
    if(e && (e.name === "NotAllowedError" || e.name === "SecurityError")) throw e;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }
  return micStream;
}

let capNode = null, meterAnalyser = null, chunks = [], chunkLen = 0, recTimer = null, meterRAF = null;

async function startRec(){
  showErr("");
  let ctx, stream;
  try{
    ctx = await ensureCtx();
    stream = await getMic();
  }catch(e){
    if(e && (e.name === "NotAllowedError" || e.name === "SecurityError")){
      showErr("マイクの使用が許可されませんでした。ブラウザの設定でこのページにマイクを許可してから、もう一度お試しください。");
    }else{
      showErr(e.message || "マイクを開けませんでした。");
    }
    return;
  }

  rawRate = ctx.sampleRate;
  chunks = []; chunkLen = 0;
  const src = ctx.createMediaStreamSource(stream);

  meterAnalyser = ctx.createAnalyser();
  meterAnalyser.fftSize = 1024;
  src.connect(meterAnalyser);

  if(workletReady){
    capNode = new AudioWorkletNode(ctx, "capture", { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[1] });
    capNode.port.onmessage = ev => { chunks.push(ev.data); chunkLen += ev.data.length; };
    src.connect(capNode);
    // 出力を消音して接続（一部ブラウザは destination 未接続だと処理が走らない）
    const mute = ctx.createGain(); mute.gain.value = 0;
    capNode.connect(mute); mute.connect(ctx.destination);
  }else{
    capNode = ctx.createScriptProcessor(4096, 1, 1);
    capNode.onaudioprocess = ev => {
      const d = ev.inputBuffer.getChannelData(0);
      chunks.push(new Float32Array(d));
      chunkLen += d.length;
    };
    src.connect(capNode);
    const mute = ctx.createGain(); mute.gain.value = 0;
    capNode.connect(mute); mute.connect(ctx.destination);
  }
  capNode._src = src;

  isRecording = true;
  $("recBtn").classList.add("recording");
  $("recLabel").textContent = "タップで停止";
  $("recBtn").querySelector(".mic-icon").textContent = "⏹";
  drawMeter();

  const t0 = Date.now();
  recTimer = setInterval(() => {
    const sec = (Date.now() - t0) / 1000;
    $("recStatus").textContent = "録音中… " + sec.toFixed(1) + " 秒 / " + MAX_SEC + " 秒";
    if(sec >= MAX_SEC) stopRec();
  }, 100);
}

function stopRec(){
  if(!isRecording) return;
  isRecording = false;
  clearInterval(recTimer); recTimer = null;
  cancelAnimationFrame(meterRAF); meterRAF = null;

  if(capNode){
    try{ capNode._src.disconnect(); }catch(e){}
    try{ capNode.disconnect(); }catch(e){}
    if(capNode.port) capNode.port.onmessage = null;
    capNode.onaudioprocess = null;
    capNode = null;
  }
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }

  $("recBtn").classList.remove("recording");
  $("recLabel").textContent = "タップで録音";
  $("recBtn").querySelector(".mic-icon").textContent = "🎤";
  clearMeter();

  // 連結
  const all = new Float32Array(chunkLen);
  let o = 0;
  for(const c of chunks){ all.set(c, o); o += c.length; }
  chunks = [];

  if(chunkLen < rawRate * 0.25){
    rawPCM = null;
    $("recStatus").textContent = "短すぎて録れませんでした。もう一度、少し長めに話してみてください。";
    setPlayEnabled(false);
    return;
  }

  rawPCM = trimSilence(all, rawRate);
  renderDirty = true;
  renderedBuf = null;
  $("recStatus").textContent = "録音しました（" + (rawPCM.length / rawRate).toFixed(1) + " 秒）。プリセットを選んで聴き比べてください。";
  setPlayEnabled(true);
  autoPlay();
}

// 前後の無音を落とす（タップ音を含めないため）
function trimSilence(d, rate){
  const th = 0.012;
  let s = 0, e = d.length - 1;
  while(s < d.length && Math.abs(d[s]) < th) s++;
  while(e > s && Math.abs(d[e]) < th) e--;
  const pad = Math.floor(rate * 0.06);
  s = Math.max(0, s - pad);
  e = Math.min(d.length - 1, e + pad);
  if(e - s < rate * 0.2) return d;
  return d.slice(s, e + 1);
}

/* ============================================================
   レベルメーター
   ============================================================ */
function drawMeter(){
  const cv = $("meter"), g = cv.getContext("2d");
  const buf = new Uint8Array(meterAnalyser.fftSize);
  const hist = new Array(64).fill(0);
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim() || "#6d5bd0";

  const loop = () => {
    meterAnalyser.getByteTimeDomainData(buf);
    let sum = 0;
    for(let i = 0; i < buf.length; i++){ const v = (buf[i] - 128) / 128; sum += v * v; }
    hist.push(Math.min(1, Math.sqrt(sum / buf.length) * 3.2));
    hist.shift();

    g.clearRect(0, 0, cv.width, cv.height);
    const bw = cv.width / hist.length;
    g.fillStyle = accent;
    for(let i = 0; i < hist.length; i++){
      const h = Math.max(3, hist[i] * cv.height);
      g.globalAlpha = 0.35 + 0.65 * (i / hist.length);
      g.fillRect(i * bw + 1, (cv.height - h) / 2, bw - 2, h);
    }
    g.globalAlpha = 1;
    meterRAF = requestAnimationFrame(loop);
  };
  loop();
}
function clearMeter(){
  const cv = $("meter");
  cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
}

/* ============================================================
   再生
   ============================================================ */
function stopPlay(){
  if(currentSource){
    try{ currentSource.stop(); }catch(e){}
    currentSource = null;
  }
}

async function playProcessed(){
  if(!rawPCM) return;
  stopPlay();
  $("playStatus").textContent = "変換中…";
  try{
    if(renderDirty || !renderedBuf){
      renderedBuf = await render();
      renderDirty = false;
    }
    const ctx = await ensureCtx();
    const src = ctx.createBufferSource();
    src.buffer = renderedBuf;
    src.connect(ctx.destination);
    src.onended = () => { $("playStatus").textContent = ""; };
    src.start();
    currentSource = src;
    $("playStatus").textContent = "再生中…";
  }catch(e){
    $("playStatus").textContent = "";
    showErr("変換に失敗しました: " + (e.message || e));
  }
}

async function playRaw(){
  if(!rawPCM) return;
  stopPlay();
  const ctx = await ensureCtx();
  const b = ctx.createBuffer(1, rawPCM.length, rawRate);
  b.copyToChannel(rawPCM, 0);
  const src = ctx.createBufferSource();
  src.buffer = b;
  src.connect(ctx.destination);
  src.onended = () => { $("playStatus").textContent = ""; };
  src.start();
  currentSource = src;
  $("playStatus").textContent = "元の声を再生中…";
}

let autoPlayTimer = null;
function autoPlay(){
  clearTimeout(autoPlayTimer);
  autoPlayTimer = setTimeout(() => playProcessed(), 120);
}

function setPlayEnabled(on){
  $("playBtn").disabled = !on;
  $("playRawBtn").disabled = !on;
  $("saveBtn").disabled = !on;
}

/* ============================================================
   保存・共有
   ============================================================ */
function toWav(buf){
  const d = buf.getChannelData(0);
  const rate = buf.sampleRate;
  const n = d.length;
  const ab = new ArrayBuffer(44 + n * 2);
  const v = new DataView(ab);
  const wstr = (off, s) => { for(let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  wstr(0, "RIFF");            v.setUint32(4, 36 + n * 2, true);
  wstr(8, "WAVE");            wstr(12, "fmt ");
  v.setUint32(16, 16, true);  v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);   v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);  wstr(36, "data");
  v.setUint32(40, n * 2, true);
  let o = 44;
  for(let i = 0; i < n; i++){
    let x = Math.max(-1, Math.min(1, d[i]));
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
    o += 2;
  }
  return new Blob([ab], { type: "audio/wav" });
}

async function save(){
  if(!rawPCM) return;
  $("playStatus").textContent = "書き出し中…";
  try{
    if(renderDirty || !renderedBuf){
      renderedBuf = await render();
      renderDirty = false;
    }
    const blob = toWav(renderedBuf);
    const name = "koekae-" + (activePreset || "custom") + ".wav";
    const file = new File([blob], name, { type: "audio/wav" });

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"こえかえ" });
      $("playStatus").textContent = "";
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    $("playStatus").textContent = "保存しました。";
  }catch(e){
    if(e && e.name === "AbortError"){ $("playStatus").textContent = ""; return; }
    $("playStatus").textContent = "";
    showErr("保存できませんでした: " + (e.message || e));
  }
}

/* ============================================================
   リアルタイム監聴
   ============================================================ */
async function startMonitor(){
  showErr("");
  if(!workletReady){
    showErr("このブラウザではリアルタイム変換に対応していません（録音してからの変換は使えます）。");
    $("monSw").checked = false;
    return;
  }
  let ctx, stream;
  try{
    ctx = await ensureCtx();
    stream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:false, autoGainControl:false, channelCount:1 }
    });
  }catch(e){
    showErr("マイクを開けませんでした。");
    $("monSw").checked = false;
    return;
  }
  const src = ctx.createMediaStreamSource(stream);
  const shifter = new AudioWorkletNode(ctx, "pitch-shifter");
  shifter.parameters.get("ratio").value = Math.pow(2, settings.semi / 12);
  const out = ctx.createGain(); out.gain.value = 0.9;
  src.connect(shifter); shifter.connect(out); out.connect(ctx.destination);
  monitorNodes = { stream, src, shifter, out };
  $("monNote").textContent = "監聴中。ハウリングしたら、すぐイヤホンを使うかオフにしてください。";
}

function stopMonitor(){
  if(!monitorNodes) return;
  const { stream, src, shifter, out } = monitorNodes;
  try{ src.disconnect(); shifter.disconnect(); out.disconnect(); }catch(e){}
  stream.getTracks().forEach(t => t.stop());
  monitorNodes = null;
  $("monNote").textContent = "高さの変更だけが反映されます（反響・ざらつきは録音時のみ）。";
}

/* ============================================================
   UI
   ============================================================ */
function showErr(msg){
  const box = $("errBox");
  if(!msg){ box.classList.add("hidden"); box.textContent = ""; return; }
  box.textContent = msg;
  box.classList.remove("hidden");
}

function renderPresets(){
  const grid = $("presetGrid");
  grid.innerHTML = "";
  for(const p of PRESETS[activeTab]){
    const b = document.createElement("button");
    b.className = "preset" + (activePreset === p.id ? " active" : "");
    b.innerHTML = '<span class="emo"></span><span class="nm"></span>';
    b.querySelector(".emo").textContent = p.emo;
    b.querySelector(".nm").textContent = p.name;
    b.onclick = () => applyPreset(p);
    grid.appendChild(b);
  }
}

function applyPreset(p){
  settings = Object.assign({}, DEFAULTS, p.s);
  activePreset = p.id;
  renderDirty = true;
  syncSliders();
  renderPresets();
  if(monitorNodes) monitorNodes.shifter.parameters.get("ratio").value = Math.pow(2, settings.semi / 12);
  if(rawPCM) autoPlay();
}

function syncSliders(){
  $("sSemi").value  = settings.semi;
  $("sThick").value = settings.thick;
  $("sDrive").value = settings.drive;
  $("sEcho").value  = settings.echo;
  $("vSemi").textContent  = (settings.semi > 0 ? "+" : "") + settings.semi;
  $("vThick").textContent = (settings.thick > 0 ? "+" : "") + settings.thick.toFixed(2).replace(/\.?0+$/, "") || "0";
  $("vDrive").textContent = settings.drive.toFixed(2).replace(/\.?0+$/, "") || "0";
  $("vEcho").textContent  = settings.echo.toFixed(2).replace(/\.?0+$/, "") || "0";
}

function onSlider(){
  settings.semi  = parseFloat($("sSemi").value);
  settings.thick = parseFloat($("sThick").value);
  settings.drive = parseFloat($("sDrive").value);
  settings.echo  = parseFloat($("sEcho").value);
  if(settings.echo > 0 && !settings.echoMs){ settings.echoMs = 180; settings.echoFb = 0.4; }
  activePreset = null;
  renderDirty = true;
  syncSliders();
  renderPresets();
  if(monitorNodes) monitorNodes.shifter.parameters.get("ratio").value = Math.pow(2, settings.semi / 12);
}

let sliderTimer = null;
function onSliderCommit(){
  clearTimeout(sliderTimer);
  if(rawPCM) sliderTimer = setTimeout(() => playProcessed(), 260);
}

function init(){
  renderPresets();
  syncSliders();

  $("recBtn").onclick = () => { isRecording ? stopRec() : startRec(); };
  $("playBtn").onclick = playProcessed;
  $("playRawBtn").onclick = playRaw;
  $("saveBtn").onclick = save;

  document.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      activeTab = t.dataset.tab;
      $("tabHint").textContent = activeTab === "gachi"
        ? "別人に聞こえるが、人の声として自然な範囲。"
        : "わかりやすく変わる方向。遠慮なく振ってあります。";
      renderPresets();
    };
  });

  ["sSemi","sThick","sDrive","sEcho"].forEach(id => {
    $(id).addEventListener("input", onSlider);
    $(id).addEventListener("change", onSliderCommit);
  });

  $("monSw").onchange = e => { e.target.checked ? startMonitor() : stopMonitor(); };

  if(location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1"){
    showErr("マイクを使うには https でこのページを開く必要があります。");
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
