# XcodeGen 用プロジェクト定義
# Mac: `brew install xcodegen && cd shortlab && xcodegen` で ShortLab.xcodeproj が生成される。
# CI: .github/workflows/shortlab-build.yml が push のたびにクラウドのMacでビルド確認する。
# Info.plist は xcodegen が Support/Info.plist に生成する(コミット対象外)。
# ソースディレクトリ内に置くと Copy Bundle Resources と二重になり
# 「Multiple commands produce Info.plist」を踏むため、sources の外に出している。
# 課金・広告のIDは Config/Store.xcconfig 経由で注入する(実IDは Store.local.xcconfig、コミット禁止)。
name: ShortLab
options:
  bundleIdPrefix: com.kuromakuaikin
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Store.xcconfig
  Release: Config/Store.xcconfig
targets:
  ShortLab:
    type: application
    platform: iOS
    sources: [ShortLab]
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: かんたん動画
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: 編集する動画を選ぶために使用します
        NSPhotoLibraryAddUsageDescription: 作った動画を写真に保存するために使用します
        # 以下は xcconfig の値がビルド時に展開される(未設定なら空=機能を出さない)
        ShortLabPremiumProductID: $(SHORTLAB_PREMIUM_PRODUCT_ID)
        ShortLabAdMobBannerUnitID: $(SHORTLAB_ADMOB_BANNER_UNIT_ID)
        GADApplicationIdentifier: $(SHORTLAB_ADMOB_APP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kuromakuaikin.shortlab
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1
